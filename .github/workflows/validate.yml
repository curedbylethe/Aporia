name: Aporia validation
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce generated outputs and check drift
        run: npm run check:drift
      - name: Run structural and accessibility tests
        run: npm test
